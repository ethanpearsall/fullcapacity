<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Base marble turbulence -->
    <filter id="marble" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.006" numOctaves="8" seed="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feComponentTransfer in="gray" result="contrast">
        <feFuncR type="linear" slope="3" intercept="-0.8"/>
        <feFuncG type="linear" slope="3" intercept="-0.8"/>
        <feFuncB type="linear" slope="3" intercept="-0.8"/>
      </feComponentTransfer>
    </filter>

    <!-- Fine grain overlay -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="12" result="fine"/>
      <feColorMatrix type="saturate" values="0" in="fine" result="fineGray"/>
      <feComponentTransfer in="fineGray" result="fineContrast">
        <feFuncR type="linear" slope="0.6" intercept="0.2"/>
        <feFuncG type="linear" slope="0.6" intercept="0.2"/>
        <feFuncB type="linear" slope="0.6" intercept="0.2"/>
      </feComponentTransfer>
    </filter>

    <!-- Veining pattern -->
    <filter id="veins" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.004 0.001" numOctaves="5" seed="7" result="veinNoise"/>
      <feColorMatrix type="saturate" values="0" in="veinNoise" result="veinGray"/>
      <feComponentTransfer in="veinGray" result="veinSharp">
        <feFuncR type="discrete" tableValues="0 0 0 0 0.12 0.2 0.12 0 0 0"/>
        <feFuncG type="discrete" tableValues="0 0 0 0 0.12 0.2 0.12 0 0 0"/>
        <feFuncB type="discrete" tableValues="0 0 0 0 0.12 0.2 0.12 0 0 0"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Dark base -->
  <rect width="100%" height="100%" fill="#0d0d0d"/>

  <!-- Marble texture layer -->
  <rect width="100%" height="100%" filter="url(#marble)" opacity="0.7"/>

  <!-- Veining layer -->
  <rect width="100%" height="100%" filter="url(#veins)" opacity="0.8"/>

  <!-- Fine grain layer -->
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.15"/>

  <!-- Subtle light source from top-left -->
  <rect width="100%" height="100%" fill="url(#lightGrad)" opacity="0.15"/>
  <defs>
    <radialGradient id="lightGrad" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="black" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Darken edges vignette -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
</svg>